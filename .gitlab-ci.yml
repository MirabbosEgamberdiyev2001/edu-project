# ═══════════════════════════════════════════════════════════════════════════════
# EduPlatform — GitLab CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
# Architecture: systemd services on bare metal (NOT Docker)
#   - Backend  : Spring Boot JAR  → /opt/eduplatform/app/eduplatform-backend.jar
#   - Frontend : Vite/React build → /opt/eduplatform/repo/eduPlatformFrontend/dist/
#   - Database : PostgreSQL 16 native (data is NEVER touched by this pipeline)
#   - Nginx    : Let's Encrypt SSL for test-pro.uz / admin.test-pro.uz
#
# How it works:
#   1. You push to main → this pipeline runs immediately
#   2. CI SSHes to the production server
#   3. Server runs /opt/eduplatform/scripts/update.sh which:
#        a. git pull origin main  (from GitLab)
#        b. Detects which directories changed (backend / frontend)
#        c. Rebuilds only what changed (Maven for backend, npm for frontend)
#        d. Backend: health-checks after restart, auto-rollback if health fails
#        e. Frontend: nginx reload after build
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY  — Ed25519 private key for server SSH  (type: File, protected)
#   SERVER_IP        — 62.84.186.113
# ═══════════════════════════════════════════════════════════════════════════════

stages:
  - deploy

# ── Deploy: SSH → run update.sh on server ────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -i ~/.ssh/id_ed25519 root@$SERVER_IP "
        set -e
        echo '=== GitLab CI: Triggering deployment ==='
        echo 'Running /opt/eduplatform/scripts/update.sh ...'
        bash /opt/eduplatform/scripts/update.sh
        echo '=== Deployment complete ==='
        echo 'App: https://test-pro.uz'
      "
  only:
    - main
  environment:
    name: production
    url: https://test-pro.uz
